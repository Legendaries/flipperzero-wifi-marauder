name: "FAP Build"
on:
  push:
    branches:
      - feature_wifi_marauder_app
  pull_request:
  schedule:
    # Do a build every day
    - cron: "1 1 * * *"
  workflow_dispatch:  # This enables manual triggering from the GitHub UI

jobs:
  ufbt-build-action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dev channel
            sdk-channel: dev
          - name: release channel
            sdk-channel: release
          - name: Unleashed dev
            sdk-index-url: https://up.unleashedflip.com/directory.json
            sdk-channel: dev
          - name: Unleashed release
            sdk-index-url: https://up.unleashedflip.com/directory.json
            sdk-channel: release
    name: 'ufbt: Build for ${{ matrix.name }}'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build with ufbt
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.2
        id: build-app
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          sdk-index-url: ${{ matrix.sdk-index-url }}
        continue-on-error: true  # Continue even if the build step fails, useful for debugging

      # Add Debugging Steps
      - name: Debug List contents of build directory
        run: |
          echo "Listing contents of the build directory"
          ls -l ./build

      - name: Debug Check for .fap files
        run: |
          echo "Searching for .fap files in the build directory"
          find ./build -name "*.fap" || echo "No .fap files found"

      - name: Check if artifacts exist
        run: |
          echo "Checking for artifact directory and files"
          if [ -d "${{ steps.build-app.outputs.fap-artifacts }}" ]; then
            echo "Artifact directory exists"
            ls -l "${{ steps.build-app.outputs.fap-artifacts }}"
          else
            echo "Artifact directory does not exist"
          fi

      - name: Upload app artifacts
        if: ${{ steps.build-app.outputs.fap-artifacts != '' }}  # Ensure file exists before uploading
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.build-app.outputs.fap-artifacts }}

      - name: Display build debug information
        run: |
          echo "Build logs:"
          cat ./build/logs/* || echo "No logs found"
